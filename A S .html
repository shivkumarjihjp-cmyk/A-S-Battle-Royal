:root{--bg:#121110;--card:#1b1a18;--or:#e8590c;--tx:#f3efe9;--mu:#a39d94;--ln:#2e2c29}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans Devanagari",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:14px}

p{margin:4px 0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:10px 0}
.big{font-size:18px;font-weight:700;color:var(--tx)}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;scrollbar-width:none;z-index:5}

.tab,.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tab.on,.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
button.b{background:var(--or);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin-top:8px}
button.b.g{background:#2e2c29}button.b.s{padding:6px 10px;font-size:14px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;margin-top:8px}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:14px}
.amts{display:flex;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:500;font-size:14px}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:10px;margin:8px 0}
#pinBox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;align-items:center;justify-content:center;padding:20px}
#pinBox .card{width:100%;max-width:340px;margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--or);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.top{display:flex;justify-content:space-between;align-items:flex-start}

<script>
/* ====== सेटिंग्स ====== */
const ADMIN_PIN="425263";            // आयोजक PIN बदलें
const UPI="7763969981@mbk";
/* ============================================= */
const MODES=["Solo","Duo","Squad","Clash Squad","Lone Wolf"];
const TABS=[["home","होम"],["reg","रजिस्टर"],["teams","टीमें"],["score","स्कोर"],["sched","शेड्यूल"],["free","फ्री"],["prof","प्रोफाइल"],["wd","विथड्रॉ"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>{const d=new Date(t);return isNaN(d)?esc(t):d.toLocaleString("hi-IN",{dateStyle:"medium",timeStyle:"short"})};
const rankPts=r=>({1:12,2:9,3:8,4:7,5:6,6:5,7:4,8:3,9:2,10:1})[r]||0;
const pts=t=>(t.kills||0)+(t.rp||0);
const S={teams:[],matches:[],announce:[],inbox:[],reqs:[],txns:[],free:[],wds:[],settings:[]};
const COL={teams:"teams",matches:"matches",announce:"announce",inbox:"inbox",reqs:"coinReqs",txns:"txns",free:"freeEntries",wds:"withdrawals",settings:"settings"};
let tab="home",chip="सभी",amt=null,left=0,tmr=null,org=false,sub={},db,auth,FV;
const mine=()=>localStorage.myTeam||"";
const team=id=>S.teams.find(t=>t.id==id);
const refCode=t=>String(t.id).slice(-6).toUpperCase();
const _rp=new URLSearchParams(location.search).get("ref");
if(_rp){localStorage.refBy=_rp.toUpperCase().replace(/[^A-Z0-9]/g,"");tab="reg"}
function toast(m){const e=$("#toast");e.textContent=m;e.className="on";setTimeout(()=>e.className="",2500)}
function listen(k){if(sub[k])return;sub[k]=1;db.collection(COL[k]).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{sub[k]=0;toast("Firebase: "+e.code)})}
/* ====== लोकल डेटाबेस (बिना Firebase): डेटा इसी फ़ोन में सेव होता है ====== */
function mkDB(){
 const K="esports_db",subs={};
 const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}};
 const save=d=>localStorage.setItem(K,JSON.stringify(d));
 const notify=c=>(subs[c]||[]).forEach(f=>f());
 const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
 const apply=(o,v)=>{const r={...o};for(const k in v){r[k]=(v[k]&&v[k].__inc!=null)?(+r[k]||0)+v[k].__inc:v[k]}return r};
 const snap=c=>({docs:Object.entries(load()[c]||{}).map(([id,v])=>({id,data:()=>v}))});
 const ref=(c,id)=>{const r={c,id:id||rid()};
  r.delete=()=>{const d=load();if(d[c])delete d[c][r.id];save(d);notify(c);return Promise.resolve()};
  r.update=v=>{const d=load();d[c]=d[c]||{};d[c][r.id]=apply(d[c][r.id]||{},v);save(d);notify(c);return Promise.resolve()};
  r.set=v=>{const d=load();d[c]=d[c]||{};d[c][r.id]=apply({},v);save(d);notify(c);return Promise.resolve()};
  return r};
 addEventListener("storage",e=>{if(e.key==K)Object.keys(subs).forEach(notify)});
 return{
  collection:c=>({
   doc:id=>ref(c,id),
   add:v=>{const r=ref(c);return r.set(v).then(()=>({id:r.id}))},
   onSnapshot:cb=>{(subs[c]=subs[c]||[]).push(()=>cb(snap(c)));setTimeout(()=>cb(snap(c)),0);return()=>{}}
  }),
  batch:()=>{const ops=[];return{update:(r,v)=>ops.push(()=>r.update(v)),set:(r,v)=>ops.push(()=>r.set(v)),delete:r=>ops.push(()=>r.delete()),commit:()=>{ops.forEach(f=>f());return Promise.resolve()}}}
 }
}

  b.update(db.collection("teams").doc(id),{coins:FV.increment(-c)});
  b.set(db.collection("withdrawals").doc(),{teamId:id,teamName:t.name,coins:c,upi:u,ts:Date.now()});
  b.set(db.collection("txns").doc(),{teamId:id,text:"विथड्रॉ रिक्वेस्ट",coins:-c,ts:Date.now()});
  await b.commit();toast("विथड्रॉ रिक्वेस्ट भेज दी ✅");draw(1)}

draw(1);
